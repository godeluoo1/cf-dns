name: Export 600 IPs Task

on:
  schedule:
    - cron: '0 */6 * * *'  # 每 6 小时自动抓取一次
  workflow_dispatch:       # 允许在 GitHub 页面手动点击触发

concurrency:
  group: export-ip-workflow
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予提交 ip.txt 回 main 分支的写入权限

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install cryptography

      - name: 运行 export_ip.py 脚本
        run: python export_ip.py

      - name: 自动提交 ip.txt 回 main 分支
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add ip.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 自动导出更新 ip.txt [skip ci]" && git push)
