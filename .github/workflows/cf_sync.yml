name: Cloudflare DNS Sync

on:
  schedule:
    - cron: '0 */6 * * *' # 每 6 小时自动执行一次
  workflow_dispatch:      # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 显式赋予 GitHub Actions 写入 gh-pages 分支的权限
    timeout-minutes: 15   # 防止 API 挂起导致白白消耗免费额度
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # 自动缓存 pip 依赖

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Run Sync Script
        env:
          HUAWEICLOUD_AK: ${{ secrets.HUAWEICLOUD_AK }}
          HUAWEICLOUD_SK: ${{ secrets.HUAWEICLOUD_SK }}
        run: python cf.py

      - name: Commit and Push State
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add cf_state.json
          # 如果文件有变更则提交，避免空提交报错
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto sync cf_state.json [skip ci]" && git push)

      - name: Prepare Public Directory
        run: |
          mkdir -p public
          cp status.html public/

      - name: Deploy Status Page to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
