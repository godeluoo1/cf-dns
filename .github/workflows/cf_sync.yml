name: Cloudflare DNS Sync

on:
  schedule:
    - cron: '0 */6 * * *' # 每 6 小时自动执行一次
  workflow_dispatch:      # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 显式赋予 GitHub Actions 写入 gh-pages 分支的权限
    timeout-minutes: 15   # 防止 API 挂起导致白白消耗免费额度
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # 自动缓存 pip 依赖

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Fetch State from State Branch
        run: |
          git fetch origin state || echo "State branch does not exist yet."
          git checkout origin/state -- cf_state.json || echo "No state file found."

      - name: Run Sync Script
        env:
          HUAWEICLOUD_AK: ${{ secrets.HUAWEICLOUD_AK }}
          HUAWEICLOUD_SK: ${{ secrets.HUAWEICLOUD_SK }}
        run: python cf.py

      - name: Prepare State Directory
        run: |
          mkdir -p state_out
          cp cf_state.json state_out/ || echo "No state file to push"

      - name: Push State to State Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./state_out
          publish_branch: state

      - name: Prepare Public Directory
        run: |
          mkdir -p public
          cp status.html public/

      - name: Deploy Status Page to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
